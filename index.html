<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو بلدة العصير - Juice Town</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <!-- صفحة اختيار اللغة البداية -->
    <div id="language-screen" class="language-selection-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
        <img src="logo.jpeg" alt="شعار بلدة العصير" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
        <h1 style="color: #fff; margin-bottom: 10px;">Juice Town - بلدة العصير</h1>
        <p style="color: #fff; margin-bottom: 20px;">الرجاء اختيار اللغة / Please select your language</p>
        <div class="lang-buttons" style="display: flex; gap: 10px;">
            <button onclick="setLanguage('arabic')" style="padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold;">العربية</button>
            <button onclick="setLanguage('english')" style="padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold;">English</button>
        </div>
    </div>

    <!-- التطبيق الرئيسي (المنيو والسلة) -->
    <div id="app-container" class="app-container" style="display: none;">
        
        <!-- الهيدر وأزرار الأقسام -->
        <div class="menu-header">
            <div class="logo-title-area">
                <img src="images/logo.jpeg" alt="Logo" class="top-logo">
                <h1 id="main-title">منيو بلدة العصير</h1>
            </div>
            <button id="lang-toggle-btn" class="lang-toggle-btn" onclick="toggleLanguage()">English</button>
        </div>

        <!-- شريط الأقسام العلوي -->
        <div id="categories-nav" class="categories-nav">
            <!-- يتم تعبئته برمجياً -->
        </div>

        <!-- تخطيط المنيو مع السلة -->
        <div class="main-layout">
            <div class="menu-section" id="menu-section">
                <!-- الأقسام والمنتجات تنزل هنا -->
            </div>

            <!-- سلة الطلبات الجانبية -->
            <div class="cart-section">
                <h3 id="cart-title">سلة الطلبات</h3>
                <div id="cart-list" class="cart-list">
                    <p id="cart-empty" style="text-align: center; opacity: 0.6;">السلة فارغة...</p>
                </div>
                <div class="total-box">
                    <span id="total-text">المجموع:</span>
                    <span id="total-amount">0 ر.س</span>
                </div>
                <button id="confirm-btn" class="confirm-btn" onclick="sendWhatsAppOrder()">💬 إرسال الطلب عبر الواتساب</button>
            </div>
        </div>

    </div>

    <script src="Menu.js"></script>
    <script src="app.js"></script>
</body>
</html>
